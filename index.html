<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos - Anchipurac</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFF9ED'/%3E%3Cg transform='translate(50 50) scale(3.3) translate(-12 -12)'%3E%3Cpath fill='%23FFC107' stroke='%23E08A00' stroke-width='0.9' stroke-linejoin='round' d='M13 2 4 14h7l-1 8 9-12h-7z'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: url('/fondo') no-repeat center center fixed;
            background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .tarjeta {
            background: #FFF9ED; padding: 50px; border-radius: 20px; box-shadow: 0 15px 35px rgba(60, 20, 0, 0.4);
            width: 90%; max-width: 700px; text-align: center;
        }
        .reloj { font-size: 3rem; font-weight: bold; color: #3E2723; margin-bottom: 5px; }
        .fecha { font-size: 1rem; color: #5D4037; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        select {
            width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #ddd;
            border-radius: 10px; margin-bottom: 25px; outline: none; transition: border-color 0.3s;
            cursor: pointer; color: #3E2723;
        }
        select:focus { border-color: #DF3A2C; }
        .contenedor-botones { display: flex; gap: 15px; }
        button {
            flex: 1; padding: 15px; font-size: 1.1rem; font-weight: bold; border: none;
            border-radius: 10px; cursor: pointer; color: white; transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }
        .btn-entrada { background-color: #388E3C; }
        .btn-salida { background-color: #DF3A2C; }
        .mensaje { margin-top: 20px; padding: 15px; border-radius: 10px; font-weight: bold; display: none; }
        .exito { background-color: #c8e6c9; color: #2e7d32; }
        .error { background-color: #ffcdd2; color: #d32f2f; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="reloj" id="reloj">00:00</div>
        <div class="fecha" id="fecha">Cargando...</div>

        <!-- Contadores visuales -->
        <div style="display: flex; gap: 20px; margin-bottom: 35px;">
            <!-- Caja En Sala -->
            <div onclick="abrirConsulta('trabajando')" style="flex: 1; background-color: #e8f5e9; padding: 20px; border-radius: 12px; color: #388E3C; font-weight: bold; border: 1px solid #c8e6c9; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#c8e6c9'" onmouseout="this.style.backgroundColor='#e8f5e9'" title="Clic para ver detalle">
                <div style="display: flex; flex-direction: column; align-items: flex-start;">
                    <span><i class="fa-solid fa-user-check" style="margin-right: 8px;"></i> Trabajando</span>
                    <span style="font-size: 0.75rem; font-weight: normal; margin-top: 4px; color: #2e7d32; text-transform: uppercase;"><i class="fa-solid fa-hand-pointer"></i> Clic para ver</span>
                </div>
                <div>
                    <span id="num-sala" style="font-size: 2.2rem; line-height: 1;">0</span>
                    <span style="font-size: 1.2rem; color: #388E3C;">/ <span id="num-total">0</span></span>
                </div>
            </div>
            

            <div onclick="abrirConsulta('finalizados')" style="flex: 1; background-color: #FFF3E0; padding: 20px; border-radius: 12px; color: #DF3A2C; font-weight: bold; border: 1px solid #FFCCBC; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#ffe0b2'" onmouseout="this.style.backgroundColor='#FFF3E0'" title="Clic para ver detalle">
                <div style="display: flex; flex-direction: column; align-items: flex-start;">
                    <span><i class="fa-solid fa-right-from-bracket" style="margin-right: 8px;"></i> Finalizados</span>
                    <span style="font-size: 0.75rem; font-weight: normal; margin-top: 4px; color: #c62828; text-transform: uppercase;"><i class="fa-solid fa-hand-pointer"></i> Clic para ver</span>
                </div>
                <span id="num-salieron" style="font-size: 2.2rem; line-height: 1;">0</span>
            </div>
        </div>      

        <select id="nombre">
            <option value="none" selected disabled>Selecciona tu nombre...</option>
        </select>

        <div class="contenedor-botones">
            <button class="btn-entrada" onclick="marcar('entrada')"><i class="fa-solid fa-arrow-right-to-bracket" style="margin-right: 8px;"></i> ENTRADA</button>
            <button class="btn-salida" onclick="marcar('salida')"><i class="fa-solid fa-arrow-right-from-bracket" style="margin-right: 8px;"></i> SALIDA</button>
        </div>

        <div id="notificacion" class="mensaje"></div>

        <button type="button" id="btn-excel" onclick="generarExcel()" style="margin-top: 25px; background-color: #4E342E; color: white; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; transition: 0.3s;">
            <i class="fa-solid fa-file-excel" style="margin-right: 8px;"></i> Cerrar Jornada (Generar Excel)
        </button>
        <p id="mensaje-excel" style="margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; color: #4E342E; display: none;"></p>
    </div>


    <div id="modal-consulta" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #FFF9ED; padding: 30px; border-radius: 15px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left;">
            <h3 id="modal-titulo" style="margin-top: 0; border-bottom: 2px solid; padding-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                <i id="modal-icono"></i> <span id="modal-texto-titulo">Personal</span>
            </h3>
            <ul id="lista-nombres-sala" style="list-style: none; padding: 0; margin: 20px 0; max-height: 250px; overflow-y: auto; color: #3E2723; font-size: 1.05rem; line-height: 1.6;">
            </ul>
            <button type="button" onclick="cerrarConsulta()" style="width: 100%; padding: 12px; background: #DF3A2C; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s;">
                Cerrar
            </button>
        </div>
    </div>

    <script>
        let datosEnSala = [];
        let datosFinalizados = [];

        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj').innerText = ahora.toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('fecha').innerText = ahora.toLocaleDateString('es-AR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj(); 

        function actualizarPantalla() {
            fetch('/estado')
            .then(respuesta => respuesta.json())
            .then(datos => {
                document.getElementById('num-sala').innerText = datos.en_sala;
                document.getElementById('num-total').innerText = datos.total;
                document.getElementById('num-salieron').innerText = datos.ya_salieron;
                
                datosEnSala = datos.en_sala_detalle || [];
                datosFinalizados = datos.finalizados_detalle || [];

                const select = document.getElementById('nombre');
                const seleccionado_actual = select.value; 
                select.innerHTML = '<option value="none" selected disabled>Selecciona tu nombre...</option>';
                
                datos.lista.forEach(empleado => {
                    let texto = empleado.nombre;
                    if (empleado.adentro) {
                        texto = empleado.nombre + " (En Sala)";
                    }
                    let atributo = (empleado.nombre === seleccionado_actual) ? 'selected' : '';
                    select.innerHTML += `<option value="${empleado.nombre}" ${atributo}>${texto}</option>`;
                });
                
                if (!seleccionado_actual || seleccionado_actual === 'none') {
                    select.value = 'none';
                }
            })
            .catch(error => console.error("Error al obtener datos:", error));
        }
        actualizarPantalla();

        function marcar(tipo) {
            const nombre = document.getElementById('nombre').value;
            if (nombre === 'none' || !nombre) {
                mostrarMensaje('⚠️ Selecciona un nombre primero', 'error');
                return;
            }
            fetch('/marcar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nombre: nombre, tipo: tipo })
            })
            .then(respuesta => respuesta.json())
            .then(datos => {
                const clase = datos.status === 'success' ? 'exito' : 'error';
                mostrarMensaje(datos.msg, clase);
                actualizarPantalla();
            });
        }

        function mostrarMensaje(texto, claseColor) {
            const notif = document.getElementById('notificacion');
            notif.innerText = texto;
            notif.className = `mensaje ${claseColor}`; 
            notif.style.display = 'block'; 
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        // NUEVA FUNCION: Abre el modal y lo pinta según qué caja tocaste
        function abrirConsulta(tipo) {
            const listaModal = document.getElementById('lista-nombres-sala');
            const titulo = document.getElementById('modal-titulo');
            const icono = document.getElementById('modal-icono');
            const textoTitulo = document.getElementById('modal-texto-titulo');
            
            listaModal.innerHTML = '';
            
            if (tipo === 'trabajando') {
                titulo.style.color = '#388E3C';
                titulo.style.borderBottomColor = '#c8e6c9';
                icono.className = 'fa-solid fa-users-viewfinder';
                textoTitulo.innerText = 'Personal en Instalaciones';
                
                if (datosEnSala.length > 0) {
                    datosEnSala.forEach(emp => {
                        listaModal.innerHTML += `
                        <li style="padding: 10px 0; border-bottom: 1px dashed #E6CCA5; display: flex; justify-content: space-between; align-items: center;">
                            <span><i class="fa-solid fa-building-user" style="color: #388E3C; margin-right: 8px;"></i> <b>${emp.nombre}</b></span>
                            <span style="font-size: 0.9rem; background: #e8f5e9; padding: 4px 10px; border-radius: 12px; color: #2e7d32; border: 1px solid #c8e6c9;">
                                <i class="fa-regular fa-clock"></i> Entró: ${emp.entrada}
                            </span>
                        </li>`;
                    });
                } else {
                    listaModal.innerHTML = '<li style="color: #8D6E63; font-style: italic; text-align: center;"><i class="fa-solid fa-mug-hot"></i> No hay personal en el centro.</li>';
                }
            } else if (tipo === 'finalizados') {
                titulo.style.color = '#DF3A2C';
                titulo.style.borderBottomColor = '#FFCCBC';
                icono.className = 'fa-solid fa-right-from-bracket';
                textoTitulo.innerText = 'Jornadas Finalizadas Hoy';
                
                if (datosFinalizados.length > 0) {
                    datosFinalizados.forEach(emp => {
                        listaModal.innerHTML += `
                        <li style="padding: 10px 0; border-bottom: 1px dashed #E6CCA5; display: flex; flex-direction: column; gap: 6px;">
                            <span><i class="fa-solid fa-house-user" style="color: #DF3A2C; margin-right: 8px;"></i> <b>${emp.nombre}</b></span>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #5D4037; background: #FFF3E0; padding: 6px 10px; border-radius: 8px;">
                                <span><i class="fa-solid fa-arrow-right-to-bracket" style="color: #388E3C;"></i> Entró: <b>${emp.entrada}</b></span>
                                <span><i class="fa-solid fa-arrow-right-from-bracket" style="color: #DF3A2C;"></i> Salió: <b>${emp.salida}</b></span>
                            </div>
                        </li>`;
                    });
                } else {
                    listaModal.innerHTML = '<li style="color: #8D6E63; font-style: italic; text-align: center;"><i class="fa-solid fa-bed"></i> Nadie ha finalizado su jornada aún.</li>';
                }
            }
            
            document.getElementById('modal-consulta').style.display = 'flex';
        }

        function cerrarConsulta() {
            document.getElementById('modal-consulta').style.display = 'none';
        }

        function generarExcel() {
            const btn = document.getElementById('btn-excel');
            const mensaje = document.getElementById('mensaje-excel');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Generando Excel...';
            btn.style.backgroundColor = "#8D6E63"; 
            btn.disabled = true;
            mensaje.style.display = "none"; 

            fetch('/generar_excel', { method: 'POST' })
            .then(response => response.text())
            .then(data => {
                mensaje.style.display = "block";
                
                // Si Python envía la palabra ATENCION, lo pintamos rojo y le agregamos el ícono web
                if (data.includes("ATENCION")) {
                    mensaje.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="margin-right: 5px;"></i> ' + data;
                    mensaje.style.color = "#D32F2F"; 
                } else {
                    mensaje.innerHTML = data;
                    mensaje.style.color = "#4E342E"; 
                }

                btn.innerHTML = '<i class="fa-solid fa-file-excel" style="margin-right: 8px;"></i> Cerrar Jornada (Generar Excel)';
                btn.style.backgroundColor = "#4E342E";
                btn.disabled = false;
            })
            .catch(error => {
                mensaje.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="margin-right: 5px;"></i> Error de conexión al generar Excel.';
                mensaje.style.display = "block";
                mensaje.style.color = "#D32F2F";
                
                btn.innerHTML = '<i class="fa-solid fa-file-excel" style="margin-right: 8px;"></i> Cerrar Jornada (Generar Excel)';
                btn.style.backgroundColor = "#4E342E";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
